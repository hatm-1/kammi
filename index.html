<style>

 ["المقارنة بين كسرين","نضرب تبادلياً: بسط الأول في مقام الثاني ونكتب الناتج تحت الأول، وبسط الثاني في مقام الأول ونكتبه تحت الثاني. الكسر الذي ناتجه أكبر هو الأكبر.","2/3 و 3/5 : 2 × 5 = 10 للأول و 3 × 3 = 9 للثاني ، إذن 2/3 أكبر"],
 ["كسر من عدد","كلمة (من) بعد الكسر تعني الضرب. نقسم العدد على المقام ثم نضرب في البسط.","3/4 من 60 : 60 ÷ 4 = 15 ثم 15 × 3 = 45"],
 ["الباقي بعد أخذ كسر","الكل دائماً يساوي 1 . إذا أُخذ كسر فالباقي يساوي 1 ناقص ذلك الكسر، ثم نضرب الباقي في العدد.","صرف رجل 3/4 راتبه وراتبه 8000 : الباقي 1/4 ، و 8000 ÷ 4 = 2000"],
 ["إيجاد العدد من كسره","إذا عرفت قيمة كسر من العدد، اقسم القيمة على البسط ثم اضرب في المقام (أي اضرب في مقلوب الكسر).","2/5 عدد يساوي 20 : 20 ÷ 2 = 10 ثم 10 × 5 = 50 ، فالعدد 50"],
 ["معادلات الكسور","إذا تساوى كسران نضرب تبادلياً ثم نحل المعادلة.","x/4 = 9/12 : 12 × x = 4 × 9 = 36 ، إذن x = 3"],
 ["الكسور بين 0 و 1","الكسر الذي بين 0 و 1 يصغر عند تربيعه ويكبر عند أخذ جذره، بعكس الأعداد الأكبر من 1 . هذه القاعدة مهمة في المقارنات.","مربع 1/2 يساوي 1/4 وهو أصغر من 1/2"],
 ["تبسيط الكسر","نقسم البسط والمقام على العدد نفسه حتى لا يبقى بينهما قاسم مشترك. قيمة الكسر لا تتغير.","18/24 : نقسم على 6 فيصبح 3/4"]],
"0-3":[
 ["ضرب الأعداد العشرية","نضرب الأعداد كأنها بدون فواصل، ثم نعدّ الخانات العشرية في العددين معاً ونضع الفاصلة في الناتج بعد هذا العدد من الخانات من اليمين.","0.25 × 0.4 : 25 × 4 = 100 ، وعدد الخانات العشرية 3 ، فالناتج 0.100 = 0.1"],
 ["قسمة الأعداد العشرية","نتخلص من الفاصلة في المقسوم عليه بضرب العددين في 10 أو 100 أو 1000 ، ثم نقسم قسمة عادية.","3.6 ÷ 0.12 : نضرب العددين في 100 فتصبح 360 ÷ 12 = 30"],
 ["مقارنة الأعداد العشرية","نجعل عدد الخانات العشرية متساوياً بإضافة أصفار على اليمين، ثم نقارن كأنها أعداد صحيحة. كثرة الأرقام لا تعني أن العدد أكبر.","0.5 و 0.45 و 0.505 تصبح 0.500 و 0.450 و 0.505 ، فالأكبر 0.505"],

 ["الضرب والقسمة على 10 و 100 و 1000","عند الضرب تتحرك الفاصلة إلى اليمين بعدد الأصفار، وعند القسمة تتحرك إلى اليسار بعدد الأصفار.","13.5 × 10 = 135 ، 13.5 × 100 = 1350 ، 13.5 ÷ 100 = 0.135"],
 ["تقريب العدد العشري","ننظر إلى الرقم الذي بعد الخانة المطلوبة مباشرة: إذا كان 5 أو أكثر نزيد الخانة واحداً، وإذا كان أقل من 5 نتركها كما هي، ثم نحذف ما بعدها.","3.76 لأقرب جزء من عشرة = 3.8 ، و 3.74 لأقرب جزء من عشرة = 3.7"],

 ["قوة القوة","إذا رُفعت قوة إلى أس آخر نضرب الأسين.","(3²)³ = 3⁶ لأن 2 × 3 = 6"],

 ["الأس السالب","الأس السالب لا يجعل العدد سالباً، بل يقلبه: نكتب 1 على العدد نفسه بأس موجب.","2⁻³ = 1/2³ = 1/8"],
 ["معنى الأس","الأس هو عدد مرات ضرب الأساس في نفسه، وليس ضرب الأساس في الأس.","2⁵ = 2 × 2 × 2 × 2 × 2 = 32 ، وليس 2 × 5 = 10"],
 ["توزيع الأس","الأس يتوزع على الضرب والقسمة فقط، ولا يتوزع على الجمع والطرح.","(2 × 5)³ = 2³ × 5³ = 8 × 125 = 1000 . لكن (2 + 3)² = 5² = 25 وليس 4 + 9"],

 ["جمع وطرح القوى","في الجمع والطرح لا نجمع الأسس. نأخذ القوة الأصغر عاملاً مشتركاً.","2⁵ + 2⁵ = 2 × 2⁵ = 2⁶ . و 3⁴ − 3³ = 3³ × (3 − 1) = 27 × 2 = 54"],

 ["تبسيط الجذر","نكتب العدد كحاصل ضرب مربع كامل (4 ، 9 ، 16 ، 25 ...) في عدد آخر، ثم نخرج جذر المربع الكامل أمام الجذر.","√50 = √(25 × 2) = 5√2"],
 ["الجذور التربيعية المشهورة","احفظها لأنها تختصر وقتاً كثيراً في الاختبار.","√4 = 2 ، √9 = 3 ، √16 = 4 ، √25 = 5 ، √36 = 6 ، √49 = 7 ، √64 = 8 ، √81 = 9 ، √100 = 10 ، √121 = 11 ، √144 = 12 ، √169 = 13 ، √196 = 14 ، √225 = 15"],
 ["الجذر التكعيبي","هو العدد الذي إذا ضُرب في نفسه ثلاث مرات أعطى العدد الذي تحت الجذر.","∛8 = 2 ، ∛27 = 3 ، ∛64 = 4 ، ∛125 = 5 ، ∛1000 = 10"],

 ["معادلات الجذور","للتخلص من الجذر نربّع الطرفين.","إذا كان √x = 5 فإن x = 5² = 25"],
 ["جذر الكسر والعدد العشري","جذر الكسر يساوي جذر البسط على جذر المقام. والعدد العشري نحوّله إلى كسر أو نتذكر مربعه.","√(9/16) = 3/4 ، و √0.49 = 0.7 لأن 0.7 × 0.7 = 0.49"]],
"0-6":[
 ["قانون الفرق بين مربعين","مربع عدد ناقص مربع عدد آخر يساوي (الفرق بينهما) × (مجموعهما). بالرموز: a² − b² = (a − b)(a + b). يحوّل الحساب الصعب إلى ضرب سهل.","51² − 49² = (51 − 49) × (51 + 49) = 2 × 100 = 200"],
 ["الضرب السريع","إذا كان العددان على بُعد متساوٍ من عدد سهل، نكتبهما (العدد − الفرق) × (العدد + الفرق) فيصير الناتج مربع العدد ناقص مربع الفرق.","99 × 101 = (100 − 1)(100 + 1) = 100² − 1² = 10000 − 1 = 9999"],
 ["مفكوك المربع الكامل","مربع مجموع حدين = مربع الأول + ضعف حاصل ضربهما + مربع الثاني. بالرموز: (a + b)² = a² + 2ab + b² ، و (a − b)² = a² − 2ab + b². الخطأ الشائع نسيان الحد الأوسط.","21² = (20 + 1)² = 400 + 40 + 1 = 441"],
 ["إيجاد المجموع أو الفرق","إذا أعطاك السؤال x² − y² وأعطاك x − y ، فاقسم الأول على الثاني لتحصل على x + y . والعكس صحيح.","x² − y² = 24 و x − y = 4 : إذن x + y = 24 ÷ 4 = 6"],
 ["المضاعف المشترك الأصغر","هو أصغر عدد يقبل القسمة على العددين معاً. نكتب مضاعفات الأكبر حتى نجد أول واحد يقبل القسمة على الأصغر. يُستخدم في مسائل (متى يلتقيان مرة أخرى).","العددان 4 و 6 : مضاعفات 6 هي 6 ، 12 ... والعدد 12 يقبل القسمة على 4 ، فالمضاعف المشترك الأصغر 12"],
 ["القاسم المشترك الأكبر","هو أكبر عدد يقسم العددين معاً بدون باقٍ. يُستخدم في مسائل التقسيم إلى مجموعات متساوية.","العددان 12 و 18 : قواسم 12 هي 1 ، 2 ، 3 ، 4 ، 6 ، 12 وأكبر واحد منها يقسم 18 هو 6"],

"1-0":[
 ["التناسب الطردي","كميتان تزيدان معاً أو تنقصان معاً بالنسبة نفسها (مثل عدد السلع وثمنها). نوجد قيمة الواحد ثم نضرب، أو نضرب تبادلياً.","3 أقلام بـ 12 ريالاً ، فكم ثمن 7 أقلام؟ القلم بـ 12 ÷ 3 = 4 ، إذن 7 × 4 = 28"],
 ["التناسب العكسي","كمية تزيد والأخرى تنقص (مثل عدد العمال وعدد الأيام). هنا حاصل الضرب ثابت: نضرب القيمتين المعروفتين معاً ثم نقسم على الثالثة.","6 عمال ينجزون عملاً في 10 أيام ، ففي كم يوماً ينجزه 4 عمال؟ 6 × 10 = 60 ثم 60 ÷ 4 = 15 يوماً"],
 ["التقسيم بنسبة معلومة","نجمع أجزاء النسبة، ثم نقسم المبلغ على مجموع الأجزاء لنعرف قيمة الجزء الواحد، ثم نضرب قيمة الجزء في نصيب كل شخص.","120 ريالاً بنسبة 1 : 2 : 3 : مجموع الأجزاء 6 ، قيمة الجزء 120 ÷ 6 = 20 ، فالأنصبة 20 و 40 و 60"],
 ["كتابة النسبة وتبسيطها","النسبة مقارنة بين كميتين من النوع نفسه وبالوحدة نفسها. تُكتب بنقطتين أو ككسر، وتُبسَّط مثل الكسر بقسمة الطرفين على العدد نفسه. والترتيب مهم.","12 : 18 ، نقسم الطرفين على 6 فتصبح 2 : 3"],
 ["النسبة والمجموع","إذا عُرفت النسبة بين كميتين وعُرف مجموعهما: نصيب الأولى يساوي جزأها مقسوماً على مجموع الجزأين، مضروباً في المجموع الكلي.","رجال ونساء مجموعهم 45 والنسبة 2 : 3 : مجموع الأجزاء 5 ، الجزء 45 ÷ 5 = 9 ، الرجال 18 والنساء 27"],
 ["ربط نسبتين بينهما عنصر مشترك","نجعل العنصر المشترك له القيمة نفسها في النسبتين (بتوحيده على المضاعف المشترك)، ثم نكتب النسبة الثلاثية.","A : B = 2 : 3 و B : C = 4 : 5 . نجعل B = 12 : فتصبح A : B = 8 : 12 و B : C = 12 : 15 ، إذن A : B : C = 8 : 12 : 15"],

 ["مقياس الرسم","هو تناسب طردي بين الطول على الخريطة والطول الحقيقي. نضرب الطول على الخريطة في ما يمثله السنتيمتر الواحد.","كل 1 سم يمثل 5 كم ، فإن 7.5 سم تمثل 7.5 × 5 = 37.5 كم"]],

 ["نسبة الزيادة أو النقصان","نحسب مقدار التغير (الجديد ناقص القديم)، ثم نقسمه على القيمة القديمة (الأصلية) ونضرب في 100 . الخطأ الشائع القسمة على القيمة الجديدة.","ارتفع السعر من 80 إلى 100 : التغير 20 ، و 20/80 = 1/4 = 25%"],

 ["التقريب","إذا كانت الخيارات متباعدة، قرّب الأعداد إلى أقرب عدد سهل ثم احسب.","49.8 × 20.1 تقريباً 50 × 20 = 1000"],
 ["الحل العكسي","ابدأ من الناتج النهائي وارجع خطوة خطوة بعكس كل عملية: الجمع يصبح طرحاً والضرب يصبح قسمة.","عدد أضيف إليه 7 ثم ضُرب في 2 فكان الناتج 30 : نرجع 30 ÷ 2 = 15 ثم 15 − 7 = 8"],
 ["استبدال المتغيرات بأعداد","إذا كان السؤال كله رموزاً، عوّض عن كل رمز بعدد سهل يحقق الشروط، ثم احسب وطابق مع الخيارات.","إذا كان x عدداً زوجياً فأي العبارات فردي؟ نجرّب x = 2 : x + 1 = 3 فردي"],
 ["الاستبعاد الذكي","احذف الخيارات المستحيلة قبل أن تحسب: من الإشارة، أو من كون الناتج زوجياً أو فردياً، أو من رقم الآحاد.","23 × 47 : آحاد الناتج من 3 × 7 = 21 أي 1 ، فنستبعد كل خيار آحاده ليس 1"],
 ["تحويل الكلام إلى معادلة","نفرض المجهول x ونترجم الكلمات: (يزيد على) جمع ، (ينقص عن) طرح ، (أمثال أو ضعف) ضرب ، (من) بعد الكسر ضرب.","ثلاثة أمثال عدد ناقص 4 يساوي 11 : 3x − 4 = 11 ، إذن 3x = 15 و x = 5"]],
"2-0":[
 ["القانون الأساسي","المسافة = السرعة × الزمن. ومنه: السرعة = المسافة ÷ الزمن ، والزمن = المسافة ÷ السرعة. قبل الحل وحّد الوحدات: إذا كانت السرعة بالكيلومتر في الساعة فحوّل الدقائق إلى ساعات.","سيارة سرعتها 80 كم/س تسير 3 ساعات: المسافة 80 × 3 = 240 كم . و 30 دقيقة تساوي 0.5 ساعة"],
 ["جسمان متحركان","إذا تحركا في اتجاهين متعاكسين أو نحو بعضهما نجمع السرعتين. وإذا تحركا في الاتجاه نفسه نطرح السرعتين. ثم نضرب في الزمن لنحصل على المسافة بينهما.","سيارتان من نقطة واحدة باتجاهين متعاكسين بسرعة 60 و 80 ، بعد ساعتين: (60 + 80) × 2 = 280 كم"],
 ["السرعة المتوسطة","السرعة المتوسطة = المسافة الكلية ÷ الزمن الكلي ، وليست متوسط السرعتين. في الذهاب والعودة لنفس المسافة: نضرب السرعتين في 2 ونقسم على مجموعهما.","ذهاب بسرعة 60 وعودة بسرعة 40 : 2 × 60 × 40 ÷ (60 + 40) = 4800 ÷ 100 = 48 ، وليس 50"],
 ["زمن اللحاق","إذا انطلق جسم ثم لحقه آخر أسرع منه: نحسب المسافة التي سبق بها الأول، ثم نقسمها على فرق السرعتين.","سيارة سرعتها 60 انطلقت ، وبعد ساعة انطلقت خلفها سيارة سرعتها 80 : الفارق 60 كم ، وزمن اللحاق 60 ÷ (80 − 60) = 3 ساعات"],
 ["زمن الالتقاء","إذا تحرك جسمان نحو بعضهما: نقسم المسافة بينهما على مجموع السرعتين.","المسافة 300 كم والسرعتان 70 و 80 : 300 ÷ (70 + 80) = 2 ساعة"],
 ["مسافة العجلة","في الدورة الواحدة تقطع العجلة مسافة تساوي محيطها. المسافة = عدد الدورات × المحيط ، والمحيط = 2 × π × r حيث r نصف القطر.","عجلة نصف قطرها 7 سم دارت 10 دورات (π = 22/7): المحيط 44 سم ، والمسافة 10 × 44 = 440 سم"],
 ["عبور القطار","ليعبر القطار نفقاً أو جسراً كاملاً يقطع مسافة تساوي طوله + طول النفق.","قطار طوله 100 م يعبر نفقاً طوله 200 م بسرعة 20 متراً في الثانية: 300 ÷ 20 = 15 ثانية"]],
"2-1":[
 ["مجموع الأعداد من 1 إلى n","نضرب العدد الأخير في العدد الذي يليه ثم نقسم على 2 . بالرموز: n(n + 1) ÷ 2 .","مجموع الأعداد من 1 إلى 20 : 20 × 21 ÷ 2 = 210"],
 ["المصافحات والهدايا","في المصافحات كل اثنين بينهما مصافحة واحدة: n(n − 1) ÷ 2 . أما الهدايا المتبادلة فكل شخص يعطي كل الآخرين، فلا نقسم على 2 : n(n − 1) .","6 أشخاص: المصافحات 6 × 5 ÷ 2 = 15 ، والهدايا المتبادلة 6 × 5 = 30"],
 ["عدد الأعداد بين عددين","إذا احتسبنا الطرفين: الأكبر − الأصغر + 1 . وإذا لم نحتسب الطرفين: الأكبر − الأصغر − 1 . والقاعدة نفسها لعدد الصفحات.","من 15 إلى 40 مع الطرفين: 40 − 15 + 1 = 26 . وبين 15 و 40 بدون الطرفين: 40 − 15 − 1 = 24"],
 ["المتتابعات","ابحث أولاً عن فرق ثابت بين كل حدين متتاليين (متتابعة حسابية). إذا لم تجده ابحث عن عدد ثابت يُضرب فيه كل حد (متتابعة هندسية).","3 ، 7 ، 11 ، 15 : الفرق 4 فالتالي 19 . و 2 ، 6 ، 18 ، 54 : كل حد × 3 فالتالي 162"],
 ["عدد مرات القطع","عدد مرات القطع أقل من عدد القطع بواحد.","لوح نريد تقطيعه إلى 5 قطع: نحتاج 4 قطعات . وإذا كانت القطعة الواحدة تستغرق 3 دقائق فالزمن 4 × 3 = 12 دقيقة"],
 ["الأشجار والأعمدة","على خط مستقيم له بداية ونهاية: العدد = المسافة ÷ البعد بينها + 1 . وحول شكل مغلق (دائرة أو مربع): العدد = المسافة ÷ البعد بدون إضافة.","طريق طوله 100 م وعمود كل 10 م من أوله إلى آخره: 100 ÷ 10 + 1 = 11 عموداً"],
 ["عدّ المربعات في شبكة","في شبكة مربعة n × n نجمع مربعات الأعداد من 1 إلى n ، لأن فيها مربعات صغيرة ومتوسطة وكبيرة.","شبكة 3 × 3 : 3² + 2² + 1² = 9 + 4 + 1 = 14 مربعاً"],
 ["عدّ المستطيلات في صف","في صف واحد مكوّن من n خانة: عدد المستطيلات n(n + 1) ÷ 2 .","صف من 4 خانات: 4 × 5 ÷ 2 = 10 مستطيلات"],
 ["مسائل الرؤوس والأرجل","نفرض أن كل الحيوانات من النوع الأقل أرجلاً ونحسب الأرجل، ثم نقسم الأرجل الزائدة على الفرق بين أرجل النوعين لنعرف عدد النوع الآخر.","10 حيوانات من دجاج وخراف لها 28 رجلاً: لو كلها دجاج 20 رجلاً ، الزائد 8 ، و 8 ÷ 2 = 4 خراف ، والباقي 6 دجاجات"],
 ["العمل المشترك","إذا أنجز الأول العمل وحده في زمن والثاني في زمن آخر، فزمنهما معاً = حاصل ضرب الزمنين ÷ مجموعهما.","الأول ينجز في 6 ساعات والثاني في 3 ساعات: (6 × 3) ÷ (6 + 3) = 18 ÷ 9 = 2 ساعة"],
 ["ملء الحوض وتفريغه","إذا كان صنبور يملأ ومصرف يفرّغ في الوقت نفسه: الزمن = حاصل ضرب الزمنين ÷ الفرق بينهما.","صنبور يملأ الحوض في 4 ساعات ومصرف يفرّغه في 12 ساعة: (4 × 12) ÷ (12 − 4) = 48 ÷ 8 = 6 ساعات"],
 ["مسائل الأعمار","نفرض عمر الأصغر x ونكتب عمر الآخر بدلالته ثم نكوّن معادلة. وتذكّر: الفرق بين عمرين ثابت لا يتغير مع السنين.","عمر أحمد ضعف عمر خالد ومجموعهما 36 : x + 2x = 36 ، إذن x = 12 وعمر أحمد 24"],
 ["أيام الأسبوع","الأيام تتكرر كل 7 . نقسم عدد الأيام على 7 ، والباقي هو عدد الأيام التي نتقدمها من اليوم الحالي.","اليوم الأحد ، فما اليوم بعد 30 يوماً؟ 30 ÷ 7 الباقي 2 ، نتقدم يومين: الثلاثاء"],
 ["الأنماط","إذا لم يكن الفرق ثابتاً ولا النسبة، ابحث عن نمط آخر: فروق تزيد كل مرة، أو كل حد يساوي مجموع الحدين السابقين.","1 ، 1 ، 2 ، 3 ، 5 ، 8 : كل حد مجموع سابقيه فالتالي 13 . و 2 ، 3 ، 5 ، 8 ، 12 : الفروق 1 ، 2 ، 3 ، 4 فالتالي 12 + 5 = 17"],
 ["تحويلات مهمة","الساعة 60 دقيقة والدقيقة 60 ثانية واليوم 24 ساعة. الكيلومتر 1000 متر والمتر 100 سنتيمتر والكيلوجرام 1000 جرام. وللتحويل من كم/س إلى متر في الثانية نضرب في 5/18 .","72 كم/س = 72 × 5/18 = 20 متراً في الثانية"]],
"2-2":[
 ["حركة العقارب","عقرب الدقائق يدور 360° في 60 دقيقة أي 6° في كل دقيقة. وعقرب الساعات يدور 360° في 12 ساعة أي 30° في كل ساعة (ونصف درجة في كل دقيقة).","في 20 دقيقة يقطع عقرب الدقائق 20 × 6 = 120° ، وفي 3 ساعات يقطع عقرب الساعات 3 × 30 = 90°"],
 ["قانون الزاوية بين العقربين","نضرب عدد الساعات في 30 ، ونضرب عدد الدقائق في 5.5 ، ثم نطرح الأصغر من الأكبر.","الساعة 3:30 : 3 × 30 = 90 و 30 × 5.5 = 165 ، والفرق 165 − 90 = 75°"],
 ["إذا كان الناتج أكبر من 180","المطلوب عادة الزاوية الصغرى. إذا كان الناتج أكبر من 180° نطرحه من 360° .","الساعة 8:00 : 8 × 30 = 240° ، وهي أكبر من 180 ، فالزاوية الصغرى 360 − 240 = 120°"],
 ["الساعات الكاملة","عند الساعة الكاملة يكون عقرب الدقائق على 12 ، فالزاوية = عدد الساعات × 30 (مع قاعدة الطرح من 360 إن لزم).","الساعة 3:00 الزاوية 90° ، والساعة 6:00 الزاوية 180° ، والساعة 9:00 الزاوية 90°"],
 ["الزمن المنقضي","نطرح الساعات من الساعات والدقائق من الدقائق. إذا كانت دقائق النهاية أقل، نستلف ساعة ونحوّلها إلى 60 دقيقة.","من 9:45 إلى 12:15 : نكتب 12:15 على صورة 11 ساعة و 75 دقيقة ، ثم نطرح: ساعتان و 30 دقيقة"]],
"3-0":[
 ["المتوسط الحسابي","نجمع كل القيم ثم نقسم المجموع على عددها.","متوسط 4 ، 8 ، 10 ، 14 : المجموع 36 ، و 36 ÷ 4 = 9"],
 ["المجموع من المتوسط","المجموع = المتوسط × العدد. هذه أهم فكرة: كلما أعطاك السؤال متوسطاً حوّله فوراً إلى مجموع، ثم اطرح القيم المعروفة لتجد المجهولة.","متوسط 4 أعداد 10 وثلاثة منها 8 و 9 و 13 : المجموع 40 ، والعدد الرابع 40 − 30 = 10"],
 ["متوسط الأعداد المتتالية","متوسط أعداد متتالية (أو بينها فرق ثابت) يساوي العدد الأوسط ، ويساوي أيضاً (الأول + الأخير) ÷ 2 .","متوسط الأعداد من 1 إلى 9 : (1 + 9) ÷ 2 = 5"],
 ["إضافة قيمة جديدة","نحسب المجموع المطلوب بعد الإضافة (المتوسط الجديد × العدد الجديد) ونطرح منه المجموع القديم.","متوسط 3 اختبارات 80 ويريد أن يصبح المتوسط 85 بعد الرابع: 85 × 4 = 340 و 80 × 3 = 240 ، فيحتاج 100"],
 ["متوسط مجموعتين","لا نأخذ متوسط المتوسطين إلا إذا تساوى عدد المجموعتين. نحسب مجموع كل مجموعة ثم نقسم المجموع الكلي على العدد الكلي.","10 طلاب متوسطهم 70 و 20 طالباً متوسطهم 85 : (700 + 1700) ÷ 30 = 80"],
 ["أثر التغيير على المتوسط","إذا أضفنا العدد نفسه إلى كل القيم زاد المتوسط بذلك العدد، وإذا ضربنا كل القيم في عدد ضُرب المتوسط فيه.","قيم متوسطها 10 ، أضفنا 3 إلى كل قيمة: المتوسط الجديد 13"]],
"3-1":[
 ["الاحتمال","الاحتمال = عدد النواتج المطلوبة ÷ عدد كل النواتج الممكنة. وقيمته دائماً بين 0 (مستحيل) و 1 (مؤكد).","عند رمي حجر نرد ، احتمال عدد زوجي: المطلوب 2 و 4 و 6 أي 3 نواتج من 6 ، فالاحتمال 3/6 = 1/2"],
 ["الوسيط","نرتّب القيم تصاعدياً أولاً. إذا كان عددها فردياً فالوسيط هو القيمة التي في المنتصف، وإذا كان زوجياً فهو متوسط القيمتين اللتين في المنتصف.","3 ، 7 ، 5 ، 9 ، 11 : بعد الترتيب 3 ، 5 ، 7 ، 9 ، 11 فالوسيط 7 . و 2 ، 4 ، 6 ، 8 : الوسيط (4 + 6) ÷ 2 = 5"],
 ["المنوال والمدى","المنوال هو القيمة الأكثر تكراراً. والمدى هو الفرق بين أكبر قيمة وأصغر قيمة.","2 ، 4 ، 4 ، 5 ، 7 ، 4 ، 9 : المنوال 4 لأنه تكرر 3 مرات ، والمدى 9 − 2 = 7"],
 ["احتمال حدثين","إذا أردنا حدوث الأول (و) الثاني وهما مستقلان نضرب الاحتمالين. وإذا أردنا هذا (أو) ذاك ولا يمكن حدوثهما معاً نجمع الاحتمالين.","رمي قطعتي نقود وظهور صورتين: 1/2 × 1/2 = 1/4 . ورمي نرد وظهور 1 أو 2 : 1/6 + 1/6 = 1/3"],
 ["الحدث المتمم","احتمال عدم وقوع الحدث = 1 − احتمال وقوعه.","احتمال ظهور 6 على النرد 1/6 ، فاحتمال عدم ظهوره 1 − 1/6 = 5/6"],
 ["مبدأ العد","إذا كان عندك أكثر من اختيار متتالٍ، نضرب عدد الخيارات في كل مرحلة.","3 قمصان و 4 بناطيل: 3 × 4 = 12 طريقة . وعدد الأعداد من رقمين من الأرقام 1 و 2 و 3 بدون تكرار: 3 × 2 = 6"],
 ["التباديل","عدد طرق ترتيب مجموعة أشياء في صف (الترتيب مهم): نضرب العدد في كل الأعداد الأصغر منه حتى 1 .","ترتيب 4 أشخاص في صف: 4 × 3 × 2 × 1 = 24 طريقة"],
 ["التوافيق","عدد طرق اختيار اثنين من مجموعة (الترتيب غير مهم): n(n − 1) ÷ 2 .","اختيار طالبين من 5 طلاب: 5 × 4 ÷ 2 = 10 طرق"]],
"4-0":[
 ["مجموع الزوايا الداخلية للمضلع","نطرح 2 من عدد الأضلاع ثم نضرب في 180 . بالرموز: (n − 2) × 180 .","الشكل السداسي: (6 − 2) × 180 = 720°"],
 ["المتتامتان والمتكاملتان","الزاويتان المتتامتان مجموعهما 90° ، والمتكاملتان مجموعهما 180° . لإيجاد إحداهما نطرح الأخرى من المجموع.","متمّمة الزاوية 35° هي 90 − 35 = 55° ، ومكمّلة الزاوية 65° هي 180 − 65 = 115°"],
 ["عدد أقطار المضلع","نضرب عدد الأضلاع في (عدد الأضلاع − 3) ثم نقسم على 2 . بالرموز: n(n − 3) ÷ 2 .","الشكل السداسي: 6 × 3 ÷ 2 = 9 أقطار"],
 ["الزوايا على مستقيم وحول نقطة","مجموع الزوايا المتجاورة على خط مستقيم 180° ، ومجموع الزوايا حول نقطة 360° .","زاويتان على مستقيم إحداهما 110° : الأخرى 180 − 110 = 70°"],
 ["التقابل بالرأس","عند تقاطع مستقيمين تكون كل زاويتين متقابلتين بالرأس متساويتين.","إذا كانت إحدى الزوايا 40° فالمقابلة لها 40° ، والمجاورة لها 140°"],
 ["المستقيمان المتوازيان والقاطع","الزاويتان المتبادلتان (على شكل حرف Z) متساويتان، والمتناظرتان (على شكل حرف F) متساويتان، والداخليتان في جهة واحدة (على شكل حرف U) مجموعهما 180° .","إذا كانت زاوية 65° : المتبادلة معها 65° ، والمتناظرة 65° ، والداخلية في الجهة نفسها 180 − 65 = 115°"],
 ["قاعدة شكل M","إذا وقع رأس زاوية بين مستقيمين متوازيين، فقياسها يساوي مجموع الزاويتين الطرفيتين اللتين مع المتوازيين.","الزاويتان الطرفيتان 30° و 40° : الزاوية الوسطى 30 + 40 = 70°"],
 ["المضلع المنتظم","كل أضلاعه متطابقة وكل زواياه متطابقة. قياس الزاوية الداخلية الواحدة = مجموع الزوايا الداخلية ÷ عدد الأضلاع.","الخماسي المنتظم: 540 ÷ 5 = 108° . والسداسي المنتظم 120° ، والثماني المنتظم 135°"],
 ["الزوايا الخارجية","مجموع الزوايا الخارجية لأي مضلع 360° . وفي المضلع المنتظم كل زاوية خارجية = 360 ÷ عدد الأضلاع. والداخلية مع الخارجية مجموعهما 180° .","السداسي المنتظم: الخارجية 360 ÷ 6 = 60° ، والداخلية 180 − 60 = 120°"]],
"4-1":[
 ["مساحة المثلث","المساحة = نصف القاعدة × الارتفاع. والارتفاع هو العمود النازل على القاعدة، وليس الضلع المائل.","قاعدة 10 وارتفاع 6 : ½ × 10 × 6 = 30"],
 ["نظرية فيثاغورس","في المثلث القائم: مربع الوتر = مجموع مربعي الضلعين الآخرين. واحفظ الثلاثيات المشهورة ومضاعفاتها لتختصر الحساب: 3-4-5 ، 5-12-13 ، 8-15-17 ، 7-24-25 .","ضلعا القائمة 6 و 8 : 36 + 64 = 100 ، فالوتر √100 = 10 (وهي مضاعف 3-4-5)"],
 ["متباينة المثلث","مجموع أي ضلعين يجب أن يكون أكبر من الضلع الثالث. لذلك الضلع الثالث محصور بين الفرق بين الضلعين ومجموعهما.","ضلعان 3 و 7 : الضلع الثالث أكبر من 4 وأصغر من 10 ، فلا يصلح 4 ولا 10 ولا 11"],
 ["مثلث 30-60-90","الضلع المقابل للزاوية 30° يساوي نصف الوتر، والضلع المقابل للزاوية 60° يساوي نصف الوتر × √3 .","الوتر 10 : المقابل للزاوية 30° يساوي 5 ، والمقابل للزاوية 60° يساوي 5√3"],
 ["زوايا المثلث وأنواعه","مجموع زوايا أي مثلث 180° . في متساوي الأضلاع كل زاوية 60° ، وفي متساوي الساقين زاويتا القاعدة متساويتان.","متساوي الساقين زاوية رأسه 40° : الباقي 140 ، وكل زاوية قاعدة 140 ÷ 2 = 70°"],
 ["الزاوية الخارجية للمثلث","الزاوية الخارجية تساوي مجموع الزاويتين الداخليتين البعيدتين عنها.","الداخليتان البعيدتان 50° و 60° : الخارجية 50 + 60 = 110°"],

RULES["0-0"].push(

 ["مقارنة مجموع الزوجي والفردي","في الأعداد المتتالية التي تبدأ من 1 : إذا كان آخر عدد زوجياً فمجموع الأعداد الزوجية أكبر من مجموع الفردية، وإذا كان آخر عدد فردياً فمجموع الفردية أكبر.","الأعداد من 1 إلى 6 : الزوجية 2 + 4 + 6 = 12 والفردية 1 + 3 + 5 = 9 ، وآخر عدد زوجي فالزوجية أكبر"]);
RULES["0-1"].push(
 ["آحاد الضرب والقسمة للأعداد الكبيرة","رقم آحاد حاصل الضرب يعتمد على آحاد الأعداد المضروبة فقط، فاضرب الآحاد وخذ آحاد الناتج. وفي قسمة عدد كبير جرّب الخيارات: اضرب آحاد كل خيار في آحاد المقسوم عليه، والخيار الصحيح هو الذي يعطي آحاد المقسوم.","234 × 58 : 4 × 8 = 32 فآحاد الناتج 2 . و 2176 ÷ 68 : الخيار 32 يعطي 2 × 8 = 16 وآحاده 6 مثل آحاد 2176",
  ["لمعرفة رقم العشرات في حاصل ضرب عددين كبيرين يكفي أن تضرب العدد المكوّن من آخر رقمين في الأول بالعدد المكوّن من آخر رقمين في الثاني، ثم تنظر إلى خانة العشرات في الناتج. مثال: 4213 × 5321 : 13 × 21 = 273 فرقم العشرات 7",

RULES["0-2"].push(
 ["النسبة من تساوي حاصلي ضرب","إذا كان عدد مضروباً في x يساوي عدداً آخر مضروباً في y فإن x/y يساوي العدد الثاني على الأول (نبدّل العددين). ولا نقارن بين x و y إلا إذا عرفنا إشارتيهما: إذا كانا موجبين فالمضروب في العدد الأصغر هو الأكبر، وإذا كانا سالبين انعكست المقارنة.","3x = 7y : إذن x/y = 7/3 . فإذا كانا موجبين فإن x أكبر من y ، وإذا كانا سالبين فإن x أصغر من y"]);
RULES["0-4"].push(
 ["تساوي الأسس في المعادلة","إذا تساوى الأسان في طرفي المعادلة فالأساسان متساويان، مع الانتباه إلى أن الأس الزوجي يعطي قيمتين (العدد وسالبه). وإذا تساوى الأسان والأساسان مختلفان فلا تتحقق المساواة إلا إذا كان الأس صفراً.","x⁵ = 3⁵ يعطي x = 3 ، و x⁴ = 3⁴ يعطي x = 3 أو x = −3 . وإذا كان العدد 5 مرفوعاً للأس (x − 2) يساوي العدد 7 مرفوعاً للأس (x − 2) فإن x − 2 = 0 أي x = 2"]);
RULES["0-5"].push(

RULES["0-6"].push(

RULES["1-0"].push(
 ["التناسب المركب","إذا تغيّر في المسألة أكثر من كمية (مثل عدد العمال وعدد الأيام وكمية الإنتاج) نوجد أولاً ما ينجزه الواحد في وحدة الزمن، ثم نضرب في العدد الجديد والزمن الجديد. الإنتاج يتناسب طردياً مع عدد العمال ومع الزمن.","4 عمال يصنعون 24 قطعة في 3 أيام: العامل الواحد يصنع في اليوم 24 ÷ (4 × 3) = 2 . إذن 5 عمال في 6 أيام يصنعون 2 × 5 × 6 = 60 قطعة"]);
RULES["1-2"].push(

RULES["1-3"].push(

RULES["0-2"].push(["مقلوب الكسر","مقلوب العدد هو تبديل بسطه ومقامه. العدد الذي بين 0 و 1 مقلوبه أكبر من 1 فهو أكبر منه، والعدد الأكبر من 1 مقلوبه بين 0 و 1 فهو أصغر منه، والعدد 1 مقلوبه نفسه.","مقلوب 2/5 هو 5/2 وهو أكبر منه ، ومقلوب 3 هو 1/3 وهو أصغر منه"]);
RULES["0-3"].push(["مقارنة الأعداد العشرية السالبة","نقارن العددين بدون الإشارة بعد توحيد عدد الخانات، ثم نعكس النتيجة: في الأعداد السالبة الأكبر هو الأقرب إلى الصفر.","−0.4 و −0.35 : بدون الإشارة 0.40 أكبر من 0.35 ، فنعكس ويكون −0.35 هو الأكبر"]);
RULES["0-5"].push(

RULES["1-0"].push(
 ["النسبة إلى الجميع","إذا أُعطيت النسبة بين جزأين فأجزاء الجميع تساوي مجموعهما، ونسبة أي جزء إلى الجميع هي أجزاؤه إلى هذا المجموع. وبالعكس: إذا أُعطيت نسبة جزء إلى الجميع فأجزاء الجزء الآخر هي الفرق.","الأولاد إلى البنات 2 : 3 ، إذن الأولاد إلى الجميع 2 : 5 . وإذا كانت نسبة الأولاد إلى الجميع 3 : 7 فالأولاد إلى البنات 3 : 4"],
 ["الأنصبة من الفرق بينها","إذا عُرفت النسبة والفرق بين النصيبين نقسم الفرق على فرق الأجزاء لنحصل على قيمة الجزء الواحد، ثم نضربه في أجزاء المطلوب.","قُسم مبلغ بنسبة 3 : 5 والفرق بين النصيبين 40 ، فالجزء الواحد 40 ÷ (5 − 3) = 20 ، والنصيبان 60 و 100 والمبلغ كله 160"]);
RULES["1-1"].push(["النسبة المئوية الكسرية والعشرية","علامة % تعني القسمة على 100 مهما كان العدد الذي قبلها، حتى لو كان كسراً أو عدداً عشرياً. في العدد العشري نحرّك الفاصلة خانتين إلى اليسار، وفي الكسر نضرب المقام في 100 .","العدد العشري 0.5% يساوي 0.005 ، والكسر 1/4% يساوي 1/400"]);

TIPS["0-1"]={10:["بعض الأعداد آحاد قواها ثابت أو يتبدل بين رقمين فقط: قوى 5 آحادها 5 دائماً ، وقوى 6 آحادها 6 دائماً. وقوى 9 آحادها 9 إذا كان الأس فردياً و 1 إذا كان زوجياً ، وقوى 4 آحادها 4 إذا كان الأس فردياً و 6 إذا كان زوجياً."]};
TIPS["2-0"]={0:["إذا كانت السرعة بالكيلومتر في الساعة والمطلوب بالمتر أو الزمن بالثواني فحوّل السرعة أولاً: من كم/س إلى متر في الثانية نضرب في 5/18 ، والعكس نضرب في 18/5 . مثال: 72 كم/س تساوي 72 × 5/18 = 20 متراً في الثانية"],
 1:["إذا لم تذكر المسألة اتجاه حركة الجسمين فنفترض أنهما يتحركان في الاتجاه نفسه ونطرح السرعتين."],
 2:["إذا اختلفت السرعتان فالسرعة المتوسطة أصغر دائماً من متوسط السرعتين (مجموعهما ÷ 2). مثال: ذهاب بسرعة 60 وعودة بسرعة 40 ، السرعة المتوسطة 48 وهي أصغر من 50"],
 3:["انتبه من أي لحظة يُحسب الزمن: زمن اللحاق محسوب من انطلاق الجسم الثاني. فإذا كان المطلوب الزمن من بداية الحركة (من انطلاق الأول) فأضف الفارق الزمني بينهما إلى زمن اللحاق."]};
TIPS["2-1"]={9:["لإيجاد زمن أحد العاملين وحده إذا عُرف زمنهما معاً وزمن الآخر: زمنه وحده = حاصل ضرب الزمنين ÷ الفرق بينهما. مثال: معاً في 2 ساعة والأول وحده في 3 ساعات ، فالثاني وحده (3 × 2) ÷ (3 − 2) = 6 ساعات"],
 10:["إذا كان هناك صنبوران ومصرف: نكتب ما يملؤه كل صنبور في الساعة (واحد على زمنه) ونجمعهما، ثم نطرح ما يفرّغه المصرف في الساعة، ثم نقلب الناتج فنحصل على الزمن. مثال: صنبوران يملآن الحوض في ساعتين وفي 3 ساعات ومصرف يفرّغه في 6 ساعات: ما يُملأ في الساعة 1/2 + 1/3 − 1/6 = 2/3 ، فالزمن 3/2 أي ساعة ونصف"],
 12:["الساعة أيضاً دورية وتتكرر كل 24 ساعة ، فنقسم عدد الساعات على 24 ونضيف الباقي فقط. مثال: الساعة 9 صباحاً ، وبعد 50 ساعة: 50 ÷ 24 الباقي 2 فتصبح 11 صباحاً"],
 14:["عند التحويل من وحدة كبيرة إلى وحدة أصغر نضرب ، ومن وحدة صغيرة إلى وحدة أكبر نقسم. مثال: 3 ساعات = 3 × 60 = 180 دقيقة ، و 240 دقيقة = 240 ÷ 60 = 4 ساعات"]};

RULES["2-1"].push(
 ["عدد المباريات","في دوري يلعب فيه كل فريقين معاً: عدد اللقاءات = عدد الفرق × (عدد الفرق − 1) ÷ 2 ، ثم نضرب في عدد المرات التي يلعب فيها كل فريقين معاً.","8 فرق يلعب كل فريقين مرتين: 8 × 7 ÷ 2 = 28 ثم 28 × 2 = 56 مباراة"],
 ["عدد الأعداد الزوجية أو الفردية","نحدد أول عدد وآخر عدد من النوع المطلوب داخل المدى ، ثم نطرح الأول من الأخير ونقسم الناتج على 2 ونضيف 1 .","الأعداد الزوجية من 7 إلى 40 : أولها 8 وآخرها 40 ، فعددها (40 − 8) ÷ 2 + 1 = 17"],
 ["عدد المشابك","عند تعليق قطع متجاورة على حبل بحيث يمسك كل مشبك طرفي قطعتين متجاورتين ، مع مشبك عند كل طرف: عدد المشابك = عدد القطع + 1 .","8 قطع تحتاج 9 مشابك"],
 ["عدد الأعواد","لتكوين صف من أشكال متلاصقة يشترك كل شكلين متجاورين في عود: للمثلثات العدد = عدد المثلثات × 2 + 1 ، وللمربعات العدد = عدد المربعات × 3 + 1 .","صف من 6 مثلثات يحتاج 6 × 2 + 1 = 13 عوداً ، وصف من 6 مربعات يحتاج 6 × 3 + 1 = 19 عوداً"],
 ["عدّ المستطيلات في شبكة","في شبكة مستطيلة نحسب عدد المستطيلات في صف واحد أفقياً وفي عمود واحد رأسياً (n(n + 1) ÷ 2 لكل منهما) ثم نضرب الناتجين. والمربعات تُحسب ضمن المستطيلات.","شبكة من صفين و 4 أعمدة: الأفقي 4 × 5 ÷ 2 = 10 والرأسي 2 × 3 ÷ 2 = 3 ، فعدد المستطيلات 30"],
 ["المثلثات المشتركة في رأس واحد","إذا خرجت من رأس واحد عدة قطع مستقيمة إلى قاعدة واحدة فعدد المثلثات = عدد القطع × (عدد القطع − 1) ÷ 2 ، حيث نحسب ضلعي المثلث ضمن القطع.","5 قطع من الرأس: 5 × 4 ÷ 2 = 10 مثلثات"],
 ["حيوانات الحظيرة (كلها ما عدا)","إذا قيل كلها من النوع الأول ما عدا عدد ، وكلها من الثاني ما عدا عدد ، وهكذا لكل نوع: نجمع هذه الأعداد ونقسم على (عدد الأنواع − 1) فنحصل على المجموع الكلي. وعدد أي نوع = المجموع − العدد المكتوب معه.","ماعز وأبقار وإبل: كلها ماعز ما عدا 7 ، وأبقار ما عدا 6 ، وإبل ما عدا 5 : المجموع (7 + 6 + 5) ÷ 2 = 9 ، والماعز 9 − 7 = 2"],
 ["تساوي المدخرات","إذا كان مع شخصين مبلغان مختلفان ويدّخر كل منهما مبلغاً ثابتاً يومياً ، فعدد الأيام حتى يتساوى ما معهما = فرق المبلغين ÷ فرق الادخار اليومي.","الأول معه 100 ويدّخر 4 ، والثاني معه 40 ويدّخر 10 : (100 − 40) ÷ (10 − 4) = 10 أيام"],

async function openPdf(f,start,back){

function viewTimer(){
  const sets=[[25,5],[50,10],[15,3]],cyc=store.pomo.n%4;
  app.innerHTML='<header class="stack"><h1>مؤقت بومودورو</h1><p class="muted">ذاكر بتركيز ثم خذ استراحة. بعد كل 4 جلسات استراحة طويلة</p></header>'+
  '<section class="card stack"><div class="seg" id="pm">'+sets.map(s=>'<button data-f="'+s[0]+'" data-b="'+s[1]+'" aria-pressed="'+(store.pomo.f===s[0])+'">'+s[0]+' / '+s[1]+' د</button>').join("")+'</div>'+
  '<div class="ring"><svg viewBox="0 0 220 220"><circle class="tr" cx="110" cy="110" r="100"></circle><circle id="pring" class="pr'+(P.mode==="focus"?"":" brk")+'" cx="110" cy="110" r="100" stroke-dasharray="628" stroke-dashoffset="0"></circle></svg><div><span class="muted">'+MODE[P.mode]+'</span><b class="m" id="ptime">'+mmss(P.left)+'</b></div></div>'+
  (P.note?'<p style="text-align:center">'+P.note+'</p>':'')+
  '<div class="dots" aria-label="الجلسات في هذه الدورة">'+[0,1,2,3].map(i=>'<i class="'+(i<cyc?"on":"")+'"></i>').join("")+'</div>'+
  '<div class="row" style="justify-content:center"><button class="btn primary" id="ps">'+(P.running?"إيقاف مؤقت":"ابدأ")+'</button><button class="btn" id="pr">إعادة</button><button class="btn" id="pk">تخطَّ</button></div></section>'+
  '<section class="summary"><div><b>'+store.pomo.n+'</b><span>جلسات اليوم</span></div><div><b>'+store.pomo.n*store.pomo.f+'</b><span>دقيقة مذاكرة</span></div><div><b>'+(4-cyc)+'</b><span>حتى الاستراحة الطويلة</span></div></section>';
  $("#ps").onclick=()=>{P.note="";if(P.running){P.running=false}else{P.running=true;P.end=Date.now()+P.left*1000}viewTimer()};
  $("#pr").onclick=()=>{P.running=false;P.left=dur(P.mode);P.note="";viewTimer()};
  $("#pk").onclick=()=>{P.running=false;P.mode=P.mode==="focus"?"break":"focus";P.left=dur(P.mode);P.note="";viewTimer()};
  app.querySelectorAll("#pm button").forEach(b=>b.onclick=()=>{store.pomo.f=+b.dataset.f;store.pomo.b=+b.dataset.b;save();P.running=false;P.left=dur(P.mode);viewTimer()});
  pTick();
}
$("#set").innerHTML=ic("gear");
setTab("home");
/* العمل بدون إنترنت: يحفظ نسخة من التطبيق على الجهاز (يتطلب رابط https) */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
