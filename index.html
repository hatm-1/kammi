<style>

:root{

    --accent:hsl(var(--h) 90% 76%); --accent-ink:hsl(var(--h) 60% 12%); --accent-soft:hsl(var(--h) 42% 21%);
    --gold:#f0c060; --gold-soft:#3a2e12; --good:#5ad08c; --good-soft:#12301f; --bad:#f58378; --bad-soft:#3b1c1a;

}

  --bg:#090d18; --surface:#131a2c; --surface2:#0e1424; --ink:#e9edf7; --muted:#97a1ba; --line:#242d45;

  background:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(150deg,var(--hero1),var(--hero2))}

"0-0":[

 ["الزوجي والفردي","في الجمع والطرح: إذا كان العددان من النوع نفسه (زوجيان أو فرديان) فالناتج زوجي، وإذا اختلفا فالناتج فردي. في الضرب: الناتج فردي في حالة واحدة فقط وهي أن يكون العددان فرديين، وغير ذلك زوجي.","7 + 9 = 16 زوجي ، 7 + 4 = 11 فردي ، 7 × 9 = 63 فردي ، 7 × 4 = 28 زوجي"],
 ["العدد الأولي","هو عدد أكبر من 1 ولا يقبل القسمة إلا على 1 وعلى نفسه. العدد 1 ليس أولياً، والعدد 2 هو العدد الأولي الزوجي الوحيد. لتتأكد أن العدد أولي جرّب قسمته على 2 و 3 و 5 و 7.","الأعداد الأولية الأولى: 2 ، 3 ، 5 ، 7 ، 11 ، 13 ، 17 ، 19 . والعدد 9 ليس أولياً لأنه 3 × 3"],
 ["قاعدة الإشارات","في الضرب والقسمة: الإشارتان المتشابهتان تعطيان موجباً والمختلفتان تعطيان سالباً. في الجمع: إذا تشابهت الإشارتان نجمع ونضع الإشارة نفسها، وإذا اختلفتا نطرح الأصغر من الأكبر ونضع إشارة الأكبر.","(−4) × (−5) = 20 ، (−4) × 5 = −20 ، −9 + 4 = −5 ، −3 − 6 = −9"],

 ["جمع الأعداد المتكررة","إذا تكرر العدد نفسه في الجمع فلا تجمع واحداً واحداً. اضرب العدد في عدد مرات تكراره.","25 + 25 + 25 + 25 = 25 × 4 = 100"],
 ["العامل المشترك","إذا كان عدد واحد مضروباً في أكثر من عدد، نخرجه خارج قوس ونجمع أو نطرح ما بداخل القوس أولاً، ثم نضرب مرة واحدة.","17 × 6 + 17 × 4 = 17 × (6 + 4) = 17 × 10 = 170"],
 ["مجموع الأعداد الفردية والزوجية","مجموع أول n عدد فردي (بدءاً من 1) يساوي n². ومجموع أول n عدد زوجي (بدءاً من 2) يساوي n(n + 1). المهم أن تعدّ كم عدداً عندك.","1 + 3 + 5 + 7 + 9 : خمسة أعداد فالمجموع 5² = 25 . و 2 + 4 + 6 + 8 + 10 : خمسة أعداد فالمجموع 5 × 6 = 30"],
 ["الأعداد المتتالية","مجموع أعداد متتالية يساوي العدد الأوسط مضروباً في عددها. وإذا كان عددها زوجياً نجمع الأول مع الأخير ونضرب في نصف عددها. ومجموع أي عددين متتاليين عدد فردي دائماً.","10 + 11 + 12 + 13 + 14 : الأوسط 12 وعددها 5 فالمجموع 12 × 5 = 60"]],

 ["القسمة على 3 وعلى 9","اجمع أرقام العدد. إذا كان المجموع يقبل القسمة على 3 فالعدد يقبل القسمة على 3، وإذا كان المجموع يقبل القسمة على 9 فالعدد يقبل القسمة على 9.","العدد 471 : مجموع أرقامه 4 + 7 + 1 = 12 ، والعدد 12 يقبل القسمة على 3 ولا يقبلها على 9 ، إذن 471 يقبل القسمة على 3 فقط"],
 ["القسمة على 4","انظر إلى آخر رقمين فقط (الآحاد والعشرات). إذا كان العدد المكوّن منهما يقبل القسمة على 4 فالعدد كله يقبلها.","العدد 1316 : آخر رقمين 16 و 16 ÷ 4 = 4 ، إذن 1316 يقبل القسمة على 4"],
 ["القسمة على 6","يجب أن يتحقق شرطان معاً: أن يكون العدد زوجياً (يقبل القسمة على 2) وأن يكون مجموع أرقامه يقبل القسمة على 3.","العدد 414 : زوجي ومجموع أرقامه 9 ، إذن يقبل القسمة على 6 . أما 123 فمجموعه 6 لكنه فردي فلا يقبل"],
 ["القسمة على 11","اجمع الأرقام التي في الخانات الفردية (الأولى والثالثة...) واجمع التي في الخانات الزوجية، ثم اطرح. إذا كان الفرق صفراً أو 11 أو من مضاعفات 11 فالعدد يقبل القسمة على 11.","العدد 2585 : (2 + 8) − (5 + 5) = 0 ، إذن يقبل القسمة على 11"],
 ["القسمة على 2 و 5 و 10","انظر إلى رقم الآحاد فقط. على 2: الآحاد زوجي. على 5: الآحاد 0 أو 5. على 10: الآحاد 0.","العدد 370 : آحاده 0 فيقبل القسمة على 2 و 5 و 10 . والعدد 135 آحاده 5 فيقبل القسمة على 5 فقط"],
 ["القسمة على 8","انظر إلى آخر ثلاثة أرقام. إذا كان العدد المكوّن منها يقبل القسمة على 8 فالعدد كله يقبلها.","العدد 5120 : آخر ثلاثة أرقام 120 و 120 ÷ 8 = 15 ، إذن يقبل القسمة على 8"],
 ["القسمة على 7","احذف رقم الآحاد، ثم اطرح ضعفه من العدد الباقي. إذا كان الناتج صفراً أو من مضاعفات 7 فالعدد يقبل القسمة على 7.","العدد 343 : نحذف 3 فيبقى 34 ، ثم 34 − 6 = 28 ، و 28 من مضاعفات 7 ، إذن 343 يقبل القسمة على 7"],
 ["باقي القسمة","الباقي هو ما يزيد من العدد بعد أخذ أكبر مضاعف ممكن للمقسوم عليه. على 5 و 10 يُعرف الباقي من رقم الآحاد، وعلى 3 و 9 يُعرف من مجموع الأرقام.","باقي قسمة 47 على 5 : أقرب مضاعف 45 والباقي 2 . وباقي قسمة 47 على 9 : مجموع الأرقام 11 و 11 − 9 = 2"],
 ["التحليل إلى عوامل أولية","أي عدد يمكن كتابته كحاصل ضرب أعداد أولية. نقسم على 2 ما أمكن، ثم 3، ثم 5 وهكذا حتى نصل إلى 1.","60 = 2 × 30 = 2 × 2 × 15 = 2 × 2 × 3 × 5"],
 ["القيمة المطلقة","هي بُعد العدد عن الصفر، ولذلك ناتجها موجب دائماً أو صفر. وإذا كانت القيمة المطلقة لمجهول تساوي عدداً موجباً فللمجهول قيمتان: العدد وسالبه.","|−7| = 7 و |7| = 7 . وإذا كان |x| = 5 فإن x = 5 أو x = −5"],
 ["رقم الآحاد في القوى","آحاد الناتج يعتمد على آحاد الأساس فقط، ويتكرر في دورة ثابتة. نكتب الدورة ثم نقسم الأس على طولها ونأخذ الباقي.","آحاد قوى العدد 2 تتكرر: 2 ، 4 ، 8 ، 6 . لإيجاد آحاد 2¹⁰ : 10 ÷ 4 الباقي 2 فالآحاد هو الثاني في الدورة أي 4"]],

 ["المضاعف المشترك الأصغر","هو أصغر عدد يقبل القسمة على العددين معاً. نكتب مضاعفات الأكبر حتى نجد أول واحد يقبل القسمة على الأصغر. يُستخدم في مسائل (متى يلتقيان مرة أخرى).","العددان 4 و 6 : مضاعفات 6 هي 6 ، 12 ... والعدد 12 يقبل القسمة على 4 ، فالمضاعف المشترك الأصغر 12"],

"1-0":[
 ["التناسب الطردي","كميتان تزيدان معاً أو تنقصان معاً بالنسبة نفسها (مثل عدد السلع وثمنها). نوجد قيمة الواحد ثم نضرب، أو نضرب تبادلياً.","3 أقلام بـ 12 ريالاً ، فكم ثمن 7 أقلام؟ القلم بـ 12 ÷ 3 = 4 ، إذن 7 × 4 = 28"],
 ["التناسب العكسي","كمية تزيد والأخرى تنقص (مثل عدد العمال وعدد الأيام). هنا حاصل الضرب ثابت: نضرب القيمتين المعروفتين معاً ثم نقسم على الثالثة.","6 عمال ينجزون عملاً في 10 أيام ، ففي كم يوماً ينجزه 4 عمال؟ 6 × 10 = 60 ثم 60 ÷ 4 = 15 يوماً"],
 ["التقسيم بنسبة معلومة","نجمع أجزاء النسبة، ثم نقسم المبلغ على مجموع الأجزاء لنعرف قيمة الجزء الواحد، ثم نضرب قيمة الجزء في نصيب كل شخص.","120 ريالاً بنسبة 1 : 2 : 3 : مجموع الأجزاء 6 ، قيمة الجزء 120 ÷ 6 = 20 ، فالأنصبة 20 و 40 و 60"],
 ["كتابة النسبة وتبسيطها","النسبة مقارنة بين كميتين من النوع نفسه وبالوحدة نفسها. تُكتب بنقطتين أو ككسر، وتُبسَّط مثل الكسر بقسمة الطرفين على العدد نفسه. والترتيب مهم.","12 : 18 ، نقسم الطرفين على 6 فتصبح 2 : 3"],
 ["النسبة والمجموع","إذا عُرفت النسبة بين كميتين وعُرف مجموعهما: نصيب الأولى يساوي جزأها مقسوماً على مجموع الجزأين، مضروباً في المجموع الكلي.","رجال ونساء مجموعهم 45 والنسبة 2 : 3 : مجموع الأجزاء 5 ، الجزء 45 ÷ 5 = 9 ، الرجال 18 والنساء 27"],
 ["ربط نسبتين بينهما عنصر مشترك","نجعل العنصر المشترك له القيمة نفسها في النسبتين (بتوحيده على المضاعف المشترك)، ثم نكتب النسبة الثلاثية.","A : B = 2 : 3 و B : C = 4 : 5 . نجعل B = 12 : فتصبح A : B = 8 : 12 و B : C = 12 : 15 ، إذن A : B : C = 8 : 12 : 15"],
 ["حساب الزكاة","زكاة المال 2.5% ، وهي تساوي المبلغ ÷ 40 . وإذا عُرفت الزكاة فالمبلغ = الزكاة × 40 .","مبلغ 8000 ريال : زكاته 8000 ÷ 40 = 200 ريال"],
 ["مقياس الرسم","هو تناسب طردي بين الطول على الخريطة والطول الحقيقي. نضرب الطول على الخريطة في ما يمثله السنتيمتر الواحد.","كل 1 سم يمثل 5 كم ، فإن 7.5 سم تمثل 7.5 × 5 = 37.5 كم"]],
"1-1":[
 ["حساب الجزء من الكل","نضرب العدد في النسبة ثم نقسم على 100 . وللسرعة: 10% تعني القسمة على 10 ، و 50% النصف ، و 25% الربع ، و 1% القسمة على 100 .","20% من 150 : 10% تساوي 15 ، إذن 20% تساوي 30"],
 ["إيجاد النسبة المئوية","نقسم الجزء على الكل ثم نضرب في 100 .","15 من 60 : 15/60 = 1/4 ، و 1/4 × 100 = 25%"],
 ["نسبة الزيادة أو النقصان","نحسب مقدار التغير (الجديد ناقص القديم)، ثم نقسمه على القيمة القديمة (الأصلية) ونضرب في 100 . الخطأ الشائع القسمة على القيمة الجديدة.","ارتفع السعر من 80 إلى 100 : التغير 20 ، و 20/80 = 1/4 = 25%"],
 ["حساب الكل من الجزء","إذا عُرفت قيمة نسبة من العدد: نضرب القيمة في 100 ثم نقسم على النسبة.","30% من عدد تساوي 24 : 24 × 100 ÷ 30 = 80"],
 ["التحويل بين النسبة والكسر والعشري","النسبة المئوية كسر مقامه 100 . واحفظ المشهورة لأنها تسهّل الحساب.","25% = 25/100 = 1/4 = 0.25 . والمشهورة: 50% = 1/2 ، 20% = 1/5 ، 75% = 3/4 ، 12.5% = 1/8"],
 ["حيلة التبديل","نسبة عدد من عدد آخر تساوي عكسها، فاختر الأسهل منهما للحساب.","16% من 50 = 50% من 16 = 8"]],
"1-2":[
 ["الربح والخسارة","الربح = ثمن البيع − ثمن الشراء. إذا كان ثمن البيع أقل من ثمن الشراء فالفرق خسارة.","اشترى بـ 200 وباع بـ 250 : الربح 250 − 200 = 50 ريالاً"],
 ["نسبة الربح أو الخسارة","نقسم مقدار الربح (أو الخسارة) على ثمن الشراء ثم نضرب في 100 . النسبة تُحسب دائماً من ثمن الشراء وليس من ثمن البيع.","ربح 50 على شراء 200 : 50/200 = 1/4 = 25%"],
 ["خصمان متتاليان","لا نجمع النسبتين. نطبّق الخصم الأول، ثم نطبّق الخصم الثاني على السعر الجديد.","500 ريال بخصم 20% ثم 10% : بعد الأول 400 ، ثم خصم 10% من 400 أي 40 ، فالسعر 360 وليس 350"],
 ["السعر بعد الزيادة أو الخصم","نحسب قيمة الزيادة أو الخصم من السعر الأصلي، ثم نضيفها أو نطرحها.","200 ريال بخصم 25% : الخصم 50 ، والسعر 200 − 50 = 150"],
 ["إيجاد السعر الأصلي","السعر الأصلي يمثل 100% . بعد ربح 20% يصبح ثمن البيع 120% ، وبعد خسارة 15% يصبح 85% . نقسم ثمن البيع على هذه النسبة ونضرب في 100 .","بيعت بـ 360 بربح 20% : 360 × 100 ÷ 120 = 300 . وبيعت بـ 340 بخسارة 15% : 340 × 100 ÷ 85 = 400"],
 ["زيادة ثم خصم بالنسبة نفسها","النتيجة لا ترجع إلى السعر الأصلي بل تكون أقل منه، لأن الخصم يُحسب من سعر أكبر.","100 ريال زيادة 10% تصبح 110 ، ثم خصم 10% من 110 أي 11 ، فالسعر 99"],
 ["زيادتان متتاليتان","الزيادة الثانية تُحسب على السعر بعد الزيادة الأولى، فالمجموع أكبر من جمع النسبتين.","100 ريال زيادة 10% تصبح 110 ، ثم زيادة 10% من 110 أي 11 ، فالسعر 121 وليس 120"]],
"1-3":[
 ["التجريب بالخيارات","إذا كانت الخيارات أعداداً والمطلوب قيمة مجهول، عوّض بكل خيار في شروط السؤال. الخيار الذي يحقق الشروط هو الجواب. ابدأ بالخيار الأوسط.","عدد إذا ضُرب في 3 وأضيف إليه 4 صار 19 : نجرّب 5 : 5 × 3 + 4 = 19 ، إذن الجواب 5"],
 ["أسئلة المقارنة","قبل الحكم جرّب أكثر من نوع من الأعداد: موجب، سالب، كسر بين 0 و 1 ، صفر، واحد. إذا تغيّرت النتيجة من تجربة لأخرى فالجواب (المعطيات غير كافية).","مربع عدد والعدد نفسه: عند 2 المربع أكبر ، وعند 1/2 العدد أكبر ، إذن المعطيات غير كافية"],
 ["التقريب","إذا كانت الخيارات متباعدة، قرّب الأعداد إلى أقرب عدد سهل ثم احسب.","49.8 × 20.1 تقريباً 50 × 20 = 1000"],
 ["الحل العكسي","ابدأ من الناتج النهائي وارجع خطوة خطوة بعكس كل عملية: الجمع يصبح طرحاً والضرب يصبح قسمة.","عدد أضيف إليه 7 ثم ضُرب في 2 فكان الناتج 30 : نرجع 30 ÷ 2 = 15 ثم 15 − 7 = 8"],
 ["استبدال المتغيرات بأعداد","إذا كان السؤال كله رموزاً، عوّض عن كل رمز بعدد سهل يحقق الشروط، ثم احسب وطابق مع الخيارات.","إذا كان x عدداً زوجياً فأي العبارات فردي؟ نجرّب x = 2 : x + 1 = 3 فردي"],
 ["الاستبعاد الذكي","احذف الخيارات المستحيلة قبل أن تحسب: من الإشارة، أو من كون الناتج زوجياً أو فردياً، أو من رقم الآحاد.","23 × 47 : آحاد الناتج من 3 × 7 = 21 أي 1 ، فنستبعد كل خيار آحاده ليس 1"],
 ["تحويل الكلام إلى معادلة","نفرض المجهول x ونترجم الكلمات: (يزيد على) جمع ، (ينقص عن) طرح ، (أمثال أو ضعف) ضرب ، (من) بعد الكسر ضرب.","ثلاثة أمثال عدد ناقص 4 يساوي 11 : 3x − 4 = 11 ، إذن 3x = 15 و x = 5"]],
"2-0":[
 ["القانون الأساسي","المسافة = السرعة × الزمن. ومنه: السرعة = المسافة ÷ الزمن ، والزمن = المسافة ÷ السرعة. قبل الحل وحّد الوحدات: إذا كانت السرعة بالكيلومتر في الساعة فحوّل الدقائق إلى ساعات.","سيارة سرعتها 80 كم/س تسير 3 ساعات: المسافة 80 × 3 = 240 كم . و 30 دقيقة تساوي 0.5 ساعة"],
 ["جسمان متحركان","إذا تحركا في اتجاهين متعاكسين أو نحو بعضهما نجمع السرعتين. وإذا تحركا في الاتجاه نفسه نطرح السرعتين. ثم نضرب في الزمن لنحصل على المسافة بينهما.","سيارتان من نقطة واحدة باتجاهين متعاكسين بسرعة 60 و 80 ، بعد ساعتين: (60 + 80) × 2 = 280 كم"],
 ["السرعة المتوسطة","السرعة المتوسطة = المسافة الكلية ÷ الزمن الكلي ، وليست متوسط السرعتين. في الذهاب والعودة لنفس المسافة: نضرب السرعتين في 2 ونقسم على مجموعهما.","ذهاب بسرعة 60 وعودة بسرعة 40 : 2 × 60 × 40 ÷ (60 + 40) = 4800 ÷ 100 = 48 ، وليس 50"],
 ["زمن اللحاق","إذا انطلق جسم ثم لحقه آخر أسرع منه: نحسب المسافة التي سبق بها الأول، ثم نقسمها على فرق السرعتين.","سيارة سرعتها 60 انطلقت ، وبعد ساعة انطلقت خلفها سيارة سرعتها 80 : الفارق 60 كم ، وزمن اللحاق 60 ÷ (80 − 60) = 3 ساعات"],
 ["زمن الالتقاء","إذا تحرك جسمان نحو بعضهما: نقسم المسافة بينهما على مجموع السرعتين.","المسافة 300 كم والسرعتان 70 و 80 : 300 ÷ (70 + 80) = 2 ساعة"],
 ["مسافة العجلة","في الدورة الواحدة تقطع العجلة مسافة تساوي محيطها. المسافة = عدد الدورات × المحيط ، والمحيط = 2 × π × r حيث r نصف القطر.","عجلة نصف قطرها 7 سم دارت 10 دورات (π = 22/7): المحيط 44 سم ، والمسافة 10 × 44 = 440 سم"],
 ["عبور القطار","ليعبر القطار نفقاً أو جسراً كاملاً يقطع مسافة تساوي طوله + طول النفق.","قطار طوله 100 م يعبر نفقاً طوله 200 م بسرعة 20 متراً في الثانية: 300 ÷ 20 = 15 ثانية"]],
"2-1":[
 ["مجموع الأعداد من 1 إلى n","نضرب العدد الأخير في العدد الذي يليه ثم نقسم على 2 . بالرموز: n(n + 1) ÷ 2 .","مجموع الأعداد من 1 إلى 20 : 20 × 21 ÷ 2 = 210"],
 ["المصافحات والهدايا","في المصافحات كل اثنين بينهما مصافحة واحدة: n(n − 1) ÷ 2 . أما الهدايا المتبادلة فكل شخص يعطي كل الآخرين، فلا نقسم على 2 : n(n − 1) .","6 أشخاص: المصافحات 6 × 5 ÷ 2 = 15 ، والهدايا المتبادلة 6 × 5 = 30"],
 ["عدد الأعداد بين عددين","إذا احتسبنا الطرفين: الأكبر − الأصغر + 1 . وإذا لم نحتسب الطرفين: الأكبر − الأصغر − 1 . والقاعدة نفسها لعدد الصفحات.","من 15 إلى 40 مع الطرفين: 40 − 15 + 1 = 26 . وبين 15 و 40 بدون الطرفين: 40 − 15 − 1 = 24"],
 ["المتتابعات","ابحث أولاً عن فرق ثابت بين كل حدين متتاليين (متتابعة حسابية). إذا لم تجده ابحث عن عدد ثابت يُضرب فيه كل حد (متتابعة هندسية).","3 ، 7 ، 11 ، 15 : الفرق 4 فالتالي 19 . و 2 ، 6 ، 18 ، 54 : كل حد × 3 فالتالي 162"],
 ["عدد مرات القطع","عدد مرات القطع أقل من عدد القطع بواحد.","لوح نريد تقطيعه إلى 5 قطع: نحتاج 4 قطعات . وإذا كانت القطعة الواحدة تستغرق 3 دقائق فالزمن 4 × 3 = 12 دقيقة"],
 ["الأشجار والأعمدة","على خط مستقيم له بداية ونهاية: العدد = المسافة ÷ البعد بينها + 1 . وحول شكل مغلق (دائرة أو مربع): العدد = المسافة ÷ البعد بدون إضافة.","طريق طوله 100 م وعمود كل 10 م من أوله إلى آخره: 100 ÷ 10 + 1 = 11 عموداً"],
 ["عدّ المربعات في شبكة","في شبكة مربعة n × n نجمع مربعات الأعداد من 1 إلى n ، لأن فيها مربعات صغيرة ومتوسطة وكبيرة.","شبكة 3 × 3 : 3² + 2² + 1² = 9 + 4 + 1 = 14 مربعاً"],
 ["عدّ المستطيلات في صف","في صف واحد مكوّن من n خانة: عدد المستطيلات n(n + 1) ÷ 2 .","صف من 4 خانات: 4 × 5 ÷ 2 = 10 مستطيلات"],
 ["مسائل الرؤوس والأرجل","نفرض أن كل الحيوانات من النوع الأقل أرجلاً ونحسب الأرجل، ثم نقسم الأرجل الزائدة على الفرق بين أرجل النوعين لنعرف عدد النوع الآخر.","10 حيوانات من دجاج وخراف لها 28 رجلاً: لو كلها دجاج 20 رجلاً ، الزائد 8 ، و 8 ÷ 2 = 4 خراف ، والباقي 6 دجاجات"],
 ["العمل المشترك","إذا أنجز الأول العمل وحده في زمن والثاني في زمن آخر، فزمنهما معاً = حاصل ضرب الزمنين ÷ مجموعهما.","الأول ينجز في 6 ساعات والثاني في 3 ساعات: (6 × 3) ÷ (6 + 3) = 18 ÷ 9 = 2 ساعة"],
 ["ملء الحوض وتفريغه","إذا كان صنبور يملأ ومصرف يفرّغ في الوقت نفسه: الزمن = حاصل ضرب الزمنين ÷ الفرق بينهما.","صنبور يملأ الحوض في 4 ساعات ومصرف يفرّغه في 12 ساعة: (4 × 12) ÷ (12 − 4) = 48 ÷ 8 = 6 ساعات"],
 ["مسائل الأعمار","نفرض عمر الأصغر x ونكتب عمر الآخر بدلالته ثم نكوّن معادلة. وتذكّر: الفرق بين عمرين ثابت لا يتغير مع السنين.","عمر أحمد ضعف عمر خالد ومجموعهما 36 : x + 2x = 36 ، إذن x = 12 وعمر أحمد 24"],
 ["أيام الأسبوع","الأيام تتكرر كل 7 . نقسم عدد الأيام على 7 ، والباقي هو عدد الأيام التي نتقدمها من اليوم الحالي.","اليوم الأحد ، فما اليوم بعد 30 يوماً؟ 30 ÷ 7 الباقي 2 ، نتقدم يومين: الثلاثاء"],
 ["الأنماط","إذا لم يكن الفرق ثابتاً ولا النسبة، ابحث عن نمط آخر: فروق تزيد كل مرة، أو كل حد يساوي مجموع الحدين السابقين.","1 ، 1 ، 2 ، 3 ، 5 ، 8 : كل حد مجموع سابقيه فالتالي 13 . و 2 ، 3 ، 5 ، 8 ، 12 : الفروق 1 ، 2 ، 3 ، 4 فالتالي 12 + 5 = 17"],
 ["تحويلات مهمة","الساعة 60 دقيقة والدقيقة 60 ثانية واليوم 24 ساعة. الكيلومتر 1000 متر والمتر 100 سنتيمتر والكيلوجرام 1000 جرام. وللتحويل من كم/س إلى متر في الثانية نضرب في 5/18 .","72 كم/س = 72 × 5/18 = 20 متراً في الثانية"]],
"2-2":[
 ["حركة العقارب","عقرب الدقائق يدور 360° في 60 دقيقة أي 6° في كل دقيقة. وعقرب الساعات يدور 360° في 12 ساعة أي 30° في كل ساعة (ونصف درجة في كل دقيقة).","في 20 دقيقة يقطع عقرب الدقائق 20 × 6 = 120° ، وفي 3 ساعات يقطع عقرب الساعات 3 × 30 = 90°"],
 ["قانون الزاوية بين العقربين","نضرب عدد الساعات في 30 ، ونضرب عدد الدقائق في 5.5 ، ثم نطرح الأصغر من الأكبر.","الساعة 3:30 : 3 × 30 = 90 و 30 × 5.5 = 165 ، والفرق 165 − 90 = 75°"],
 ["إذا كان الناتج أكبر من 180","المطلوب عادة الزاوية الصغرى. إذا كان الناتج أكبر من 180° نطرحه من 360° .","الساعة 8:00 : 8 × 30 = 240° ، وهي أكبر من 180 ، فالزاوية الصغرى 360 − 240 = 120°"],
 ["الساعات الكاملة","عند الساعة الكاملة يكون عقرب الدقائق على 12 ، فالزاوية = عدد الساعات × 30 (مع قاعدة الطرح من 360 إن لزم).","الساعة 3:00 الزاوية 90° ، والساعة 6:00 الزاوية 180° ، والساعة 9:00 الزاوية 90°"],
 ["الزمن المنقضي","نطرح الساعات من الساعات والدقائق من الدقائق. إذا كانت دقائق النهاية أقل، نستلف ساعة ونحوّلها إلى 60 دقيقة.","من 9:45 إلى 12:15 : نكتب 12:15 على صورة 11 ساعة و 75 دقيقة ، ثم نطرح: ساعتان و 30 دقيقة"]],
"3-0":[
 ["المتوسط الحسابي","نجمع كل القيم ثم نقسم المجموع على عددها.","متوسط 4 ، 8 ، 10 ، 14 : المجموع 36 ، و 36 ÷ 4 = 9"],
 ["المجموع من المتوسط","المجموع = المتوسط × العدد. هذه أهم فكرة: كلما أعطاك السؤال متوسطاً حوّله فوراً إلى مجموع، ثم اطرح القيم المعروفة لتجد المجهولة.","متوسط 4 أعداد 10 وثلاثة منها 8 و 9 و 13 : المجموع 40 ، والعدد الرابع 40 − 30 = 10"],
 ["متوسط الأعداد المتتالية","متوسط أعداد متتالية (أو بينها فرق ثابت) يساوي العدد الأوسط ، ويساوي أيضاً (الأول + الأخير) ÷ 2 .","متوسط الأعداد من 1 إلى 9 : (1 + 9) ÷ 2 = 5"],
 ["إضافة قيمة جديدة","نحسب المجموع المطلوب بعد الإضافة (المتوسط الجديد × العدد الجديد) ونطرح منه المجموع القديم.","متوسط 3 اختبارات 80 ويريد أن يصبح المتوسط 85 بعد الرابع: 85 × 4 = 340 و 80 × 3 = 240 ، فيحتاج 100"],
 ["متوسط مجموعتين","لا نأخذ متوسط المتوسطين إلا إذا تساوى عدد المجموعتين. نحسب مجموع كل مجموعة ثم نقسم المجموع الكلي على العدد الكلي.","10 طلاب متوسطهم 70 و 20 طالباً متوسطهم 85 : (700 + 1700) ÷ 30 = 80"],
 ["أثر التغيير على المتوسط","إذا أضفنا العدد نفسه إلى كل القيم زاد المتوسط بذلك العدد، وإذا ضربنا كل القيم في عدد ضُرب المتوسط فيه.","قيم متوسطها 10 ، أضفنا 3 إلى كل قيمة: المتوسط الجديد 13"]],
"3-1":[

  const list=[...e.target.files];e.target.value="";if(!list.length)return;
  if(!window.pdfjsLib){if(tab==="files")viewFiles("تعذّر تحميل قارئ الملفات. تأكد من اتصالك بالإنترنت ثم أعد فتح التطبيق");return}
  adding=true;if(tab==="files")viewFiles();let bad="";
  for(const file of list){const o={name:file.name,blob:file};
    try{const pdf=await getPdf(o);o.pages=pdf.numPages;o.kind=o.pages===146?"t":o.pages===84?"g":"";
      files=files.filter(x=>x.name!==o.name&&!(o.kind&&x.kind===o.kind));files.push(o);dbDo("readwrite",s=>s.put({name:o.name,blob:o.blob,pages:o.pages,kind:o.kind}))}
    catch(err){bad="تعذّر فتح الملف "+file.name+". تأكد أنه ملف PDF سليم"}}
  adding=false;if(tab==="files"&&!app.classList.contains("reading"))viewFiles(bad);
};
async function openPdf(f,start,back){
  leave();back=back||(()=>setTab("files"));
  const quiz=f.kind==="g";let hide=quiz,zoom=store.zoom||1,n=start||1,job=0,task=null,alive=true;const marks={};
  if(!start)try{n=+localStorage.getItem("qp:"+f.name)||1}catch(e){}
  app.classList.add("reading");
  app.innerHTML='<div class="row between"><button class="back" id="bk">→ رجوع</button><h2>'+(f.kind?KN[f.kind]:esc(f.name))+'</h2></div>'+
  '<p class="muted" id="st">جارٍ فتح الملف…</p><div class="scroller" id="sc"><div class="sheet" id="sh"><canvas id="cv"></canvas><div class="cover" id="cover" hidden>مفتاح الإجابات مخفي</div></div></div>'+
  (quiz?'<button class="btn primary block" id="tg"></button><details class="card"><summary class="label">ورقة إجابتك لهذه الصفحة</summary><div class="pad" id="pad" style="margin-top:10px"></div></details>':'')+
  '<div class="rbar" id="rbar"><div><button class="btn" id="pv">السابقة</button><span class="row" style="gap:6px;flex-wrap:nowrap"><input id="pg" type="number" min="1" inputmode="numeric" aria-label="رقم الصفحة"><span class="muted" id="tot"></span></span><button class="btn sq" id="zo" aria-label="تصغير">−</button><button class="btn sq" id="zi" aria-label="تكبير">+</button><button class="btn" id="nx">التالية</button></div></div>';
  cleanup=()=>{alive=false;if(task){try{task.cancel()}catch(e){}}const cv=$("#cv");if(cv){cv.width=cv.height=1}};
  $("#bk").onclick=()=>{leave();back()};
  let pdf;try{pdf=await getPdf(f)}catch(e){if(alive)$("#st").textContent="تعذّر فتح هذا الملف. احذفه من تبويب الكتب وأضفه من جديد";return}
  if(!alive)return;
  n=Math.max(1,Math.min(pdf.numPages,n));$("#tot").textContent="/ "+pdf.numPages;$("#pg").max=pdf.numPages;$("#st").hidden=true;
  const sc=$("#sc"),sh=$("#sh"),cv=$("#cv");
  function pad(){const p=$("#pad");if(!p)return;const m=marks[n]||(marks[n]={});let h="";
    for(let i=1;i<=16;i++)h+='<div><b>'+i+'</b>'+LET.map((c,k)=>'<button data-i="'+i+'" data-k="'+k+'" aria-pressed="'+(m[i]===k)+'">'+c+'</button>').join("")+'</div>';
    p.innerHTML=h;p.querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=+b.dataset.k;m[i]=m[i]===k?undefined:k;pad()})}
  function cover(){$("#cover").hidden=!hide;const t=$("#tg");if(t)t.textContent=hide?"أظهر مفتاح الإجابات":"أخفِ مفتاح الإجابات"}
  async function draw(){
    const my=++job;if(task){try{task.cancel()}catch(e){}}
    try{
      const page=await pdf.getPage(n);if(my!==job||!alive)return;
      const base=page.getViewport({scale:1}),cssW=Math.round(sc.clientWidth*zoom),pxW=Math.min(cssW*(window.devicePixelRatio||1),2000);
      const vp=page.getViewport({scale:pxW/base.width});
      cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);cv.style.width=cssW+"px";cv.style.height=Math.round(cssW*base.height/base.width)+"px";sh.style.width=cssW+"px";
      task=page.render({canvasContext:cv.getContext("2d"),viewport:vp});await task.promise;task=null;
    }catch(e){if(e&&e.name==="RenderingCancelledException")return;if(alive&&my===job){$("#st").hidden=false;$("#st").textContent="تعذّر عرض هذه الصفحة، جرّب صفحة أخرى أو صغّر التكبير"}return}
    if(!alive)return;$("#st").hidden=true;
    $("#pg").value=n;$("#pv").disabled=n<=1;$("#nx").disabled=n>=pdf.numPages;$("#zo").disabled=zoom<=1;$("#zi").disabled=zoom>=3;
    try{localStorage.setItem("qp:"+f.name,n)}catch(e){}
    pad();
  }
  const go=k=>{k=Math.max(1,Math.min(pdf.numPages,k));if(k===n)return;n=k;if(quiz){hide=true;cover()}sc.scrollTop=0;sc.scrollLeft=0;window.scrollTo(0,0);draw()};
  const setZoom=z=>{zoom=Math.max(1,Math.min(3,z));store.zoom=zoom;save();draw()};
  $("#pv").onclick=()=>go(n-1);$("#nx").onclick=()=>go(n+1);$("#pg").onchange=e=>go(+e.target.value||n);
  $("#zo").onclick=()=>setZoom(zoom-.5);$("#zi").onclick=()=>setZoom(zoom+.5);
  if(quiz)$("#tg").onclick=()=>{hide=!hide;cover()};
  /* سحب لقلب الصفحة ونقرتان للتكبير */
  let sx=0,sy=0,st=0,lastTap=0;
  sc.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now()}},{passive:true});
  sc.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,now=Date.now();
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&now-st<300){if(now-lastTap<350){setZoom(zoom>1?1:2);lastTap=0}else lastTap=now;return}
    if(zoom===1&&Math.abs(dx)>70&&Math.abs(dy)<50&&now-st<700)go(dx>0?n+1:n-1)},{passive:true});
  cover();draw();window.scrollTo(0,0);
}


/* ---------- مؤقت بومودورو ---------- */
if(store.pomo.d!==today()){store.pomo.d=today();store.pomo.n=0}
const P={mode:"focus",left:store.pomo.f*60,running:false,end:0,note:""};
const dur=m=>(m==="focus"?store.pomo.f:m==="long"?store.pomo.b*3:store.pomo.b)*60;
const MODE={focus:"مذاكرة",break:"استراحة قصيرة",long:"استراحة طويلة"};
function pFinish(){P.running=false;sfx.bell();
  if(P.mode==="focus"){if(store.pomo.d!==today()){store.pomo.d=today();store.pomo.n=0}store.pomo.n++;save();P.mode=store.pomo.n%4===0?"long":"break";P.note="انتهت جلسة المذاكرة، خذ استراحتك"}
  else{P.mode="focus";P.note="انتهت الاستراحة، ابدأ جلسة جديدة"}
  P.left=dur(P.mode);if(tab==="timer"&&$("#ptime"))viewTimer()}
function pTick(){if(P.running){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));if(P.left<=0)pFinish()}
  const chip=$("#chip"),active=P.running||P.left!==dur(P.mode);chip.hidden=!active;chip.classList.toggle("run",P.running);
  $("#chipT").textContent=MODE[P.mode]+" "+mmss(P.left);
  const t=$("#ptime");if(t){t.textContent=mmss(P.left);const c=$("#pring");c.style.strokeDashoffset=String(628*(1-P.left/dur(P.mode)))}}
setInterval(pTick,500);$("#chip").onclick=()=>setTab("timer");
function viewTimer(){
  const sets=[[25,5],[50,10],[15,3]],cyc=store.pomo.n%4;
  app.innerHTML='<header class="stack"><h1>مؤقت بومودورو</h1><p class="muted">ذاكر بتركيز ثم خذ استراحة. بعد كل 4 جلسات استراحة طويلة</p></header>'+
  '<section class="card stack"><div class="seg" id="pm">'+sets.map(s=>'<button data-f="'+s[0]+'" data-b="'+s[1]+'" aria-pressed="'+(store.pomo.f===s[0])+'">'+s[0]+' / '+s[1]+' د</button>').join("")+'</div>'+
  '<div class="ring"><svg viewBox="0 0 220 220"><circle class="tr" cx="110" cy="110" r="100"></circle><circle id="pring" class="pr'+(P.mode==="focus"?"":" brk")+'" cx="110" cy="110" r="100" stroke-dasharray="628" stroke-dashoffset="0"></circle></svg><div><span class="muted">'+MODE[P.mode]+'</span><b class="m" id="ptime">'+mmss(P.left)+'</b></div></div>'+
  (P.note?'<p style="text-align:center">'+P.note+'</p>':'')+
  '<div class="dots" aria-label="الجلسات في هذه الدورة">'+[0,1,2,3].map(i=>'<i class="'+(i<cyc?"on":"")+'"></i>').join("")+'</div>'+
  '<div class="row" style="justify-content:center"><button class="btn primary" id="ps">'+(P.running?"إيقاف مؤقت":"ابدأ")+'</button><button class="btn" id="pr">إعادة</button><button class="btn" id="pk">تخطَّ</button></div></section>'+
  '<section class="summary"><div><b>'+store.pomo.n+'</b><span>جلسات اليوم</span></div><div><b>'+store.pomo.n*store.pomo.f+'</b><span>دقيقة مذاكرة</span></div><div><b>'+(4-cyc)+'</b><span>حتى الاستراحة الطويلة</span></div></section>';
  $("#ps").onclick=()=>{P.note="";if(P.running){P.running=false}else{P.running=true;P.end=Date.now()+P.left*1000}viewTimer()};
  $("#pr").onclick=()=>{P.running=false;P.left=dur(P.mode);P.note="";viewTimer()};
  $("#pk").onclick=()=>{P.running=false;P.mode=P.mode==="focus"?"break":"focus";P.left=dur(P.mode);P.note="";viewTimer()};
  app.querySelectorAll("#pm button").forEach(b=>b.onclick=()=>{store.pomo.f=+b.dataset.f;store.pomo.b=+b.dataset.b;save();P.running=false;P.left=dur(P.mode);viewTimer()});
  pTick();
}
$("#set").innerHTML=ic("gear");
setTab("home");
</script>
